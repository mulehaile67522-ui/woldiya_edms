services:
  - type: web
    name: woldiya-edms
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn edms_project.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: woldiya-edms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com

databases:
  - name: woldiya-edms-db
    databaseName: woldiya_edms
    user: woldiya_user
    plan: free
