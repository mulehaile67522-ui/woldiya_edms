<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ግባ – ወልድያ EDMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Ethiopic', sans-serif;
      background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      width: 100%;
      max-width: 420px;
    }
    .login-card .card-header {
      background: linear-gradient(135deg, #1a5276, #2980b9);
      border-radius: 18px 18px 0 0;
      padding: 2rem;
      text-align: center;
    }
    .login-card .card-body { padding: 2rem; }
    .btn-login { background: #1a5276; color: #fff; border: none; padding: .75rem; font-size: 1rem; border-radius: 8px; }
    .btn-login:hover { background: #154360; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="card-header">
      <i class="bi bi-archive-fill text-white fs-1 d-block mb-2"></i>
      <h3 class="text-white fw-bold mb-0">ወልድያ EDMS</h3>
      <p class="text-white-50 mb-0 small mt-1">Electronic Document Management System</p>
    </div>
    <div class="card-body">
      {% if form.errors %}
      <div class="alert alert-danger alert-sm py-2">
        <i class="bi bi-exclamation-circle me-1"></i>
        የተጠቃሚ ስም ወይም የይለፍ ቃል ትክክል አይደለም።
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">የተጠቃሚ ስም</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="ስምዎን ያስገቡ" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">የይለፍ ቃል</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="የይለፍ ቃልዎን ያስገቡ" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>ግባ
        </button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </div>
    <div class="card-footer text-center text-muted small bg-white rounded-bottom py-3">
      ወልድያ ዩኒቨርሲቲ – EDMS &copy; {% now "Y" %}
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
