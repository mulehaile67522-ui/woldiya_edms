<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — ወልድያ EDMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .error-box { background:#fff; border-radius:16px; padding:48px 40px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.1); max-width:480px; }
    .error-code { font-size:6rem; font-weight:900; color:#1b4f72; line-height:1; }
    .error-icon { font-size:3rem; color:#c8960c; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="error-box">
    <div class="error-icon"><i class="bi bi-search"></i></div>
    <div class="error-code">404</div>
    <h4 class="mt-3 fw-bold">ገጹ አልተገኘም</h4>
    <p class="text-muted">የጠየቁት ገጽ ወይም ፋይል አልተገኘም።<br>ወደ ዋናው ገጽ ይመለሱ።</p>
    <a href="/" class="btn btn-primary mt-2 px-4">
      <i class="bi bi-house me-1"></i>ወደ ዳሽቦርድ
    </a>
  </div>
</body>
</html>
