{% extends "documents/base.html" %}
{% block title %}ምድብ ሰርዝ — ወልድያ EDMS{% endblock %}
{% block page_title %}ምድብ ሰርዝ{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-lg-5">
    <div class="page-card p-5 text-center">
      <div class="mb-3" style="font-size:3rem; color:#dc2626;">
        <i class="bi bi-tags"></i>
      </div>
      <h5 class="fw-bold mb-2">ምድቡን ሊሰርዙ ነው?</h5>
      <div class="bg-light rounded p-3 my-3 fw-semibold text-primary">{{ cat }}</div>
      <p class="text-danger small">ይህ ምድብ ሲሰረዝ ሁሉም ደብዳቤዎቹ ምድብ አልባ ይሆናሉ።</p>
      <form method="post" class="d-flex justify-content-center gap-3 mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-trash me-1"></i>አዎ ሰርዝ
        </button>
        <a href="{% url 'category_list' %}" class="btn btn-outline-secondary px-4">ተው</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
