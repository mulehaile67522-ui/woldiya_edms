{% extends "documents/base.html" %}
{% block title %}ፓስዎርድ ቀይር — ወልድያ EDMS{% endblock %}
{% block page_title %}ፓስዎርድ ቀይር{% endblock %}
{% block page_subtitle %}የግል ፓስዎርድዎን ይቀይሩ{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="page-card p-4">
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold">የአሁኑ ፓስዎርድ</label>
          <input type="password" name="current_password" class="form-control" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">አዲስ ፓስዎርድ</label>
          <input type="password" name="new_password" class="form-control" required minlength="8">
          <div class="form-text text-muted">ቢያንስ 8 ፊደላት ይኑሩት።</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">አዲሱን ፓስዎርድ ያረጋግጡ</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="8">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-brand">
            <i class="bi bi-lock-fill me-1"></i> ፓስዎርድ ቀይር
          </button>
          <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> ተመለስ
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
